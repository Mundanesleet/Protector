<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Prospector C&D{% endblock %}</title>
    <link rel="icon" href="data:,">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar d-flex flex-column p-3">
            <a href="/" class="brand d-flex align-items-center mb-4 text-decoration-none">
                <i class="bi bi-box-seam-fill me-2"></i>
                <span class="fs-5 fw-semibold">Prospector C&amp;D</span>
            </a>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                    <a href="/" class="nav-link active">
                        <i class="bi bi-speedometer2 me-2"></i>Dashboard
                    </a>
                </li>
            </ul>
            <div class="mt-auto small text-muted">
                Prospección comercial<br>Cargue &amp; descargue
            </div>
        </nav>

        <div class="main-content">
            <nav class="topbar d-flex align-items-center justify-content-between px-4">
                <span class="fw-semibold">{% block page_title %}Dashboard{% endblock %}</span>
            </nav>
            <main class="p-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
